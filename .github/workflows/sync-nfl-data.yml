name: Sync NFL data

on:
  schedule:
    # Nightly roster/schedule sync — 3am ET (7am UTC)
    - cron: "0 7 * * *"
    # Live scoring poll every 5 minutes, Sun 1pm-midnight ET (17:00-04:00 UTC)
    - cron: "*/5 17-23 * * 0"
    - cron: "*/5 0-4 * * 1"
    # Thursday and Monday night windows, 8pm-midnight ET (00:00-04:00 UTC next day)
    - cron: "*/5 0-4 * * 2,5"
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Sync rosters (nightly only)
        if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/syncRoster.js

      - name: Sync live scores (game windows)
        if: github.event.schedule != '0 7 * * *' && github.event.schedule != null
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/syncLiveScores.js