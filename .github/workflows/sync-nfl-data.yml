name: Sync NFL data

on:
  schedule:
    # Nightly roster/schedule sync — 3am ET (7am UTC)
    - cron: "0 7 * * *"
    # Live scoring poll every 5 minutes, Sat AND Sun 1pm-midnight ET.
    # Widened by an extra hour on the trailing edge (0-5 instead of 0-4)
    # so this safely covers midnight ET whether ET is currently EDT
    # (UTC-4, roughly Mar-Nov) or EST (UTC-5, roughly Nov-Mar) — under
    # EDT the extra hour is just a harmless extra poll past midnight;
    # under EST it's the difference between actually covering the real
    # end of the game and cutting off an hour early.
    #
    # Saturday games (holiday slates, Weeks 15-18 flexes, occasional
    # international windows) previously had NO live-scoring coverage at
    # all — only the mid-week projections cron touched Saturday, which
    # never computes real points. Added below, mirroring the Sunday
    # pattern exactly.
    - cron: "*/5 17-23 * * 6"
    - cron: "*/5 0-5 * * 0"
    - cron: "*/5 17-23 * * 0"
    - cron: "*/5 0-5 * * 1"
    # Thursday and Monday night windows, 8pm-midnight ET — same EDT/EST
    # widening reasoning as above (0-5 instead of 0-4).
    - cron: "*/5 0-5 * * 2,5"
    # Mid-week projection refresh, 8am and 4pm ET, Tue-Sat (12:00 and 20:00 UTC)
    # so "Projected Points" sort has real data while people are setting lineups,
    # not just once games have already started.
    - cron: "0 12,20 * * 2,3,4,5,6"
  workflow_dispatch:
    inputs:
      run_live_scores:
        description: "Also run live scores/projections sync (normally only runs during scheduled game/refresh windows)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Sync rosters (nightly only)
        if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/syncRoster.js

      - name: Sync live scores (game windows)
        if: (github.event.schedule != '0 7 * * *' && github.event.schedule != null) || github.event.inputs.run_live_scores == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/syncLiveScores.js
